<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldmire</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#cdb8a1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goldmire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Goldmire dashboard: frosted glass floating over a soft, out-of-focus warm room.
   One glass window, a top bar, a left icon rail, a bottom tab bar; coral is the one accent. */
:root {
  --ink: #261e19;
  --ink-2: rgba(38, 30, 25, .66);
  --ink-3: rgba(38, 30, 25, .45);
  --glass: rgba(246, 239, 231, .30);
  --glass-strong: rgba(250, 245, 239, .52);
  --card: rgba(255, 255, 255, .26);
  --card-hover: rgba(255, 255, 255, .36);
  --card-dark: rgba(70, 55, 45, .20);
  --line: rgba(255, 255, 255, .42);
  --line-soft: rgba(255, 255, 255, .22);
  --coral: #ef6040;
  --coral-soft: rgba(239, 96, 64, .16);
  --up: #1f8a5b;
  --up-soft: rgba(31, 138, 91, .14);
  --dn: #cf3f2f;
  --dn-soft: rgba(207, 63, 47, .13);
  --amber: #e2a531;
  --blue: #4f7fe0;
  --shadow: 0 24px 70px rgba(52, 34, 20, .28), 0 2px 0 rgba(255, 255, 255, .35) inset;
  --r-xl: 30px;
  --r-lg: 22px;
  --r-md: 16px;
  --font: "Inter", -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: #cbb59e;
  -webkit-font-smoothing: antialiased; overflow: hidden; font-size: 14px;
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .dn { color: var(--dn); }

/* ---------- the room behind the glass (made of soft shapes, then blurred) ---------- */
#room { position: fixed; inset: -6%; z-index: 0; filter: blur(34px) saturate(115%); transform: scale(1.04); }
#room div { position: absolute; border-radius: 40px; }
#room .base { inset: 0; border-radius: 0; background: linear-gradient(180deg, #ece0d0 0%, #dccab4 38%, #bf9f80 70%, #8c6a4e 100%); }
#room .window { right: 4%; top: 2%; width: 24%; height: 72%; background: #fbf6ee; animation: light 36s ease-in-out infinite alternate; }
#room .window2 { right: 30%; top: 0; width: 10%; height: 40%; background: #f3eadf; }
#room .shelf { left: 12%; top: 13%; width: 62%; height: 5%; background: #6b4630; border-radius: 6px; }
#room .shelf2 { left: 18%; top: 33%; width: 46%; height: 4%; background: #7a5139; border-radius: 6px; }
#room .tv { left: 33%; top: 18%; width: 28%; height: 24%; background: #2e2622; border-radius: 10px; }
#room .books { left: 15%; top: 6%; width: 12%; height: 7%; background: #9b6a43; }
#room .sofa { left: -4%; bottom: 6%; width: 26%; height: 34%; background: #3a2b22; }
#room .chair { right: -2%; bottom: 10%; width: 14%; height: 26%; background: #5a4334; }
#room .plant { left: 54%; top: 52%; width: 9%; height: 16%; background: #6f7b3e; border-radius: 50%; }
#room .table { left: 30%; bottom: 14%; width: 36%; height: 9%; background: #8b6243; border-radius: 12px; }
#room .rug { left: 10%; bottom: -4%; width: 80%; height: 14%; background: #cfb291; border-radius: 50%; }
#room .lamp { left: 8%; top: 20%; width: 6%; height: 10%; background: #ffd9a1; border-radius: 50%; animation: glow 9s ease-in-out infinite alternate; }
@keyframes light { from { transform: translateX(0); opacity: .95; } to { transform: translateX(-3%); opacity: 1; } }
@keyframes glow { from { opacity: .55; } to { opacity: .9; } }
#grain { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .18; mix-blend-mode: soft-light;
  background-image: radial-gradient(rgba(255,255,255,.5) 1px, transparent 1px); background-size: 3px 3px; }

/* ---------- glass ---------- */
.glass {
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: var(--shadow);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgba(236, 226, 214, .92); }
}

/* ---------- top bar ---------- */
#top {
  position: fixed; z-index: 5; top: 14px; left: 50%; transform: translateX(-50%);
  width: min(1240px, calc(100% - 28px)); height: 50px; border-radius: 999px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px 0 7px;
}
.who { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13.5px; min-width: 0; }
.coin { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #ffe7a8, #e0a83a 55%, #a86d16); box-shadow: 0 2px 8px rgba(120, 70, 10, .35), inset 0 1px 0 rgba(255,255,255,.6);
  color: #5a3606; font-weight: 800; font-size: 15px; }
.who small { display: block; font-weight: 500; color: var(--ink-2); font-size: 11.5px; }
.who > div { min-width: 0; } .who > div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
#ask { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 16px 0 7px; border-radius: 999px;
  background: rgba(255,255,255,.22); border: 1px solid var(--line-soft); font-size: 12.5px; color: var(--ink-2);
  max-width: 520px; overflow: hidden; }
#ask .orb { width: 24px; height: 24px; border-radius: 50%; flex: none;
  background: conic-gradient(from 0deg, #8f7bff, #5ec7ff, #ff8fd1, #ffb36b, #8f7bff); animation: spin 6s linear infinite;
  box-shadow: 0 0 14px rgba(150, 120, 255, .55); }
#ask .orb::after { content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), transparent 55%); }
@keyframes spin { to { transform: rotate(360deg); } }
#askText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .35s, transform .35s; }
#askText.swap { opacity: 0; transform: translateY(6px); }
.right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.ibtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.55);
  display: grid; place-items: center; cursor: pointer; position: relative; transition: transform .2s, background .2s; text-decoration: none; color: var(--ink); }
.ibtn:hover { transform: translateY(-2px); background: rgba(255,255,255,.8); }
.ibtn svg { width: 17px; height: 17px; }
.ibtn .dot { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); border: 2px solid #fff; display: none; }
.ibtn.has .dot { display: block; }
.live { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 28px; border-radius: 999px; background: rgba(255,255,255,.3); color: var(--ink-2); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: #aaa; }
.live.on i { background: #34c27b; box-shadow: 0 0 0 4px rgba(52,194,123,.18); }
.live.off i { background: var(--dn); }

/* ---------- left rail ---------- */
#rail { position: fixed; z-index: 5; left: max(14px, calc(50% - 650px)); top: 50%; transform: translateY(-50%);
  padding: 8px 6px; border-radius: 999px; display: flex; flex-direction: column; gap: 6px; }
#rail button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; position: relative; color: var(--ink-2); transition: background .2s, color .2s; }
#rail button svg { width: 18px; height: 18px; }
#rail button:hover, #rail button.on { background: rgba(255,255,255,.75); color: var(--ink); }
#rail button span { position: absolute; left: 48px; top: 50%; transform: translate(-6px, -50%); opacity: 0; pointer-events: none; white-space: nowrap;
  background: rgba(255,255,255,.88); color: var(--ink); font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 8px; transition: .18s; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#rail button:hover span { opacity: 1; transform: translate(0, -50%); }

/* ---------- the window ---------- */
#win { position: fixed; z-index: 3; top: 78px; bottom: 84px; left: 50%; transform: translateX(-50%);
  width: min(1180px, calc(100% - 140px)); border-radius: var(--r-xl); overflow: hidden; }
#scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 30px 34px 40px; scrollbar-width: thin; scrollbar-color: rgba(60,40,30,.25) transparent; }
.page { display: none; }
.page.on { display: block; animation: pageIn .45s cubic-bezier(.2,.8,.2,1) both; }
.page.out { display: block; animation: pageOut .22s ease both; }
@keyframes pageIn { from { opacity: 0; filter: blur(10px); transform: translateY(10px) scale(.99); } to { opacity: 1; filter: none; transform: none; } }
@keyframes pageOut { to { opacity: 0; filter: blur(10px); transform: translateY(-6px) scale(.99); } }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
.sub { color: var(--ink-2); margin: 6px 0 0; font-size: 13.5px; max-width: 720px; line-height: 1.45; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; letter-spacing: .01em; color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h2 small { font-weight: 500; color: var(--ink-3); font-size: 11.5px; }

.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g2 { grid-template-columns: repeat(2, 1fr); }
.g-main { grid-template-columns: 1.65fr 1fr; }
.span2 { grid-column: span 2; }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 18px 18px 16px; position: relative;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), background .25s, box-shadow .25s; animation: cardIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card:hover { transform: translateY(-4px); background: var(--card-hover); box-shadow: 0 14px 34px rgba(60, 40, 25, .14); }
.card.flat:hover { transform: none; }
.card.dark { background: var(--card-dark); }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.lbl .ic { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.55); }
.lbl .ic svg { width: 14px; height: 14px; }
.big { font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 12px 0 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.5); color: var(--ink-2); white-space: nowrap; }
.chip.up { background: var(--up-soft); color: var(--up); } .chip.dn { background: var(--dn-soft); color: var(--dn); }
.chip.coral { background: var(--coral-soft); color: var(--coral); } .chip.dark { background: rgba(38,30,25,.82); color: #fff; }
.chip.amber { background: rgba(226,165,49,.18); color: #9a6a08; }
.meta { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }
.empty { color: var(--ink-3); font-size: 13px; padding: 10px 0; }
.btn { border: 0; cursor: pointer; border-radius: 999px; padding: 8px 15px; font-weight: 600; font-size: 12.5px; background: rgba(38,30,25,.88); color: #fff; transition: transform .2s; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { transform: translateY(-2px); } .btn.ghost { background: rgba(255,255,255,.55); color: var(--ink); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.35); gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: rgba(38,30,25,.88); color: #fff; }

/* lists */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.28); }
.row:last-child { border-bottom: 0; }
.row .av { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 11px; background: rgba(255,255,255,.6); }
.row .av.up { background: var(--up-soft); } .row .av.dn { background: var(--dn-soft); } .row .av.buy { background: rgba(79,127,224,.14); color: var(--blue); }
.row b { font-weight: 600; } .row .t { font-size: 13px; } .row .s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.35; }
.row .v { font-weight: 600; text-align: right; font-size: 13.5px; }

/* holdings tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 9px; }
.tile { border-radius: 14px; padding: 10px 11px; background: rgba(255,255,255,.34); border: 1px solid var(--line-soft); transition: transform .2s, background .2s; }
.tile:hover { transform: translateY(-3px); background: rgba(255,255,255,.55); }
.tile .sy { font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.tile .pl { font-weight: 600; font-size: 13px; margin-top: 6px; } .tile .c { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.tile .chip { font-size: 9.5px; padding: 2px 6px; }

/* hero card */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 16px; line-height: 1.1; }
.ring .in small { display: block; font-size: 9.5px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
.ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.ring .trk { stroke: rgba(255,255,255,.55); } .ring .val { stroke: var(--coral); transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.hname { font-size: 17px; font-weight: 600; } .hsub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.kv { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 18px; margin-top: 12px; justify-content: start; }
.kv div { font-size: 11px; color: var(--ink-3); } .kv b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; margin-top: 2px; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.goal { text-align: center; padding: 16px 12px 14px; }
.goal .ring { margin: 6px auto 10px; }
.goal .gt { font-weight: 600; font-size: 13px; } .goal .gs { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* charts */
.chart { width: 100%; height: 190px; display: block; overflow: visible; }
.chart text { font-size: 10px; fill: var(--ink-3); font-family: var(--font); }
.bar { transition: height .8s cubic-bezier(.2,.8,.2,1), y .8s cubic-bezier(.2,.8,.2,1); }
.donut { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; }
.legend { display: flex; flex-direction: column; gap: 9px; }
.legend .li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.legend .li i { width: 10px; height: 10px; border-radius: 3px; }
.legend .track { grid-column: 2 / 4; height: 5px; border-radius: 9px; background: rgba(255,255,255,.45); overflow: hidden; margin-top: -4px; }
.legend .track span { display: block; height: 100%; border-radius: 9px; }
.gauge { height: 12px; border-radius: 999px; background: rgba(255,255,255,.45); position: relative; overflow: hidden; margin: 14px 0 6px; }
.gauge span { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
.gauge .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: rgba(38,30,25,.45); }
.scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); }

/* tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.4); }
td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,.25); vertical-align: top; }
tr:last-child td { border-bottom: 0; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.alert { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: var(--r-md); background: rgba(239,96,64,.16); border: 1px solid rgba(239,96,64,.35); margin-bottom: 14px; font-size: 13px; }
.alert.done { background: rgba(255,255,255,.25); border-color: var(--line-soft); color: var(--ink-2); }
.alert b { display: block; margin-bottom: 2px; }
.cal { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.28); }
.cal:last-child { border-bottom: 0; }
.cal .d { text-align: center; border-radius: 12px; background: rgba(255,255,255,.55); padding: 5px 0; font-weight: 700; font-size: 16px; line-height: 1.05; }
.cal .d small { display: block; font-size: 9.5px; font-weight: 600; color: var(--coral); text-transform: uppercase; letter-spacing: .05em; }

/* ---------- bottom tab bar ---------- */
#tabs { position: fixed; z-index: 5; bottom: 18px; left: 50%; transform: translateX(-50%); height: 48px; border-radius: 999px;
  display: flex; align-items: center; gap: 2px; padding: 0 6px; max-width: calc(100% - 28px); }
#tabs .tl { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#tabs .tl::-webkit-scrollbar { display: none; }
#tabs button.t { border: 0; background: transparent; height: 36px; padding: 0 15px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; transition: background .25s, color .25s; }
#tabs button.t:hover { color: var(--ink); }
#tabs button.t.on { background: rgba(255,255,255,.92); color: var(--ink); box-shadow: 0 3px 12px rgba(60,40,25,.15); }
#tabs .plus { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); cursor: pointer; display: grid; place-items: center; margin-left: 6px; flex: none; box-shadow: 0 3px 12px rgba(60,40,25,.15); transition: transform .2s; }
#tabs .plus:hover { transform: rotate(90deg); }

/* ---------- sheets (suggest, update) ---------- */
#veil { position: fixed; inset: 0; z-index: 8; background: rgba(40,28,20,.18); opacity: 0; pointer-events: none; transition: opacity .25s; }
#veil.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 9; left: 50%; bottom: 84px; transform: translate(-50%, 20px); width: min(420px, calc(100% - 28px)); border-radius: 26px; padding: 20px;
  opacity: 0; pointer-events: none; transition: .3s cubic-bezier(.2,.8,.2,1); background: var(--glass-strong); }
.sheet.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.sheet h3 { margin: 0 0 4px; font-size: 16px; } .sheet p { margin: 0 0 14px; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.field input, .field select { font: inherit; font-size: 14px; color: var(--ink); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.7); outline: none; }
.field input:focus, .field select:focus { border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
.msg { font-size: 12.5px; color: var(--ink-2); min-height: 18px; margin-top: 10px; }
.pins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pins span { font-size: 11.5px; background: rgba(255,255,255,.6); border-radius: 999px; padding: 3px 4px 3px 9px; display: inline-flex; gap: 5px; align-items: center; }
.pins button { border: 0; background: rgba(38,30,25,.1); width: 18px; height: 18px; border-radius: 50%; cursor: pointer; font-size: 10px; }

/* ---------- small screens (phone) ---------- */
@media (max-width: 860px) {
  #rail { display: none; }
  #win { width: calc(100% - 16px); top: 70px; bottom: 76px; border-radius: 24px; }
  #scroll { padding: 22px 16px 30px; }
  #top { top: 10px; height: 48px; grid-template-columns: 1fr auto; width: calc(100% - 16px); }
  #ask { display: none; }
  .g4 { grid-template-columns: repeat(2, 1fr); } .g3, .g2, .g-main { grid-template-columns: 1fr; } .span2 { grid-column: auto; }
  h1 { font-size: 24px; } .big { font-size: 24px; }
  #tabs { bottom: 12px; width: calc(100% - 16px); }
  #tabs .tl { flex: 1; }
  #tabs button.t { padding: 0 11px; }
  .donut { grid-template-columns: 120px 1fr; }
  .sheet { bottom: 72px; }
}
@media (max-width: 420px) { .g4 { grid-template-columns: 1fr 1fr; gap: 10px; } .card { padding: 14px; } .big { font-size: 21px; } .who small { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="room" aria-hidden="true">
  <div class="base"></div><div class="window"></div><div class="window2"></div><div class="books"></div><div class="shelf"></div><div class="shelf2"></div>
  <div class="tv"></div><div class="lamp"></div><div class="sofa"></div><div class="chair"></div><div class="table"></div><div class="plant"></div><div class="rug"></div>
</div>
<div id="grain" aria-hidden="true"></div>

<header id="top" class="glass">
  <div class="who"><div class="coin" aria-hidden="true">G</div><div><span id="hello">Welcome back</span><small id="helloSub">Goldmire · paper trading</small></div></div>
  <div id="ask" title="What's happening"><div class="orb" aria-hidden="true"></div><span id="askText">Reading the latest from Goldmire…</span></div>
  <div class="right">
    <span id="live" class="live"><i></i><span>Connecting</span></span>
    <a class="ibtn" href="town.html" title="The classic town"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg></a>
    <button id="updBtn" class="ibtn" type="button" title="Updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="dot"></span></button>
  </div>
</header>

<nav id="rail" class="glass" aria-label="Quick links"></nav>

<main id="win" class="glass">
  <div id="scroll">
    <section class="page" id="p-overview" aria-label="Overview"></section>
    <section class="page" id="p-activity" aria-label="Activity"></section>
    <section class="page" id="p-heroes" aria-label="Heroes"></section>
    <section class="page" id="p-guardians" aria-label="Guardians"></section>
    <section class="page" id="p-reports" aria-label="Reports"></section>
    <section class="page" id="p-calendar" aria-label="Calendar"></section>
  </div>
</main>

<nav id="tabs" class="glass" aria-label="Pages">
  <div class="tl" id="tabList"></div>
  <button class="plus" id="plusBtn" type="button" title="Suggest a stock" aria-label="Suggest a stock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div id="veil"></div>
<div id="sgSheet" class="sheet glass" role="dialog" aria-label="Suggest a stock">
  <h3>Suggest a stock</h3>
  <p>A hero adds it to the list it watches. It still only buys when its own rules say so.</p>
  <label class="field">Hero<select id="sgWho"></select></label>
  <label class="field">Symbol<input id="sgSym" placeholder="e.g. AAPL" autocomplete="off" autocapitalize="characters" maxlength="12"></label>
  <button class="btn" id="sgGo" type="button">Suggest it</button>
  <div class="msg" id="sgMsg"></div>
  <div class="pins" id="sgPins"></div>
</div>
<div id="upSheet" class="sheet glass" role="dialog" aria-label="Updates">
  <h3 id="upTitle">Updates</h3>
  <p id="upText"></p>
  <div id="upBtns"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = v => (typeof v === "number" && isFinite(v)) ? v : 0;
  const usd = (v, sign = true) => { const x = n(v); const s = Math.abs(x) >= 1000 ? Math.abs(x).toLocaleString("en-US", { maximumFractionDigits: 0 }) : Math.abs(x).toFixed(2); return (x < 0 ? "−" : sign && x > 0 ? "+" : "") + "$" + s; };
  const money = v => "$" + n(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = (v, d = 1) => (v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%");
  const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "";
  const dayShort = (d, short) => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return x.toLocaleDateString("en-US", short ? { month: "short", day: "numeric" } : { weekday: "short", month: "short", day: "numeric" }); };
  const timeOf = iso => { try { return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); } catch (_) { return ""; } };
  const firstName = h => { const w = String(h || "").split(" "); return w[0] === "Old" && w[1] ? w[0] + " " + w[1] : w[0] || ""; };
  const todayNY = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });

  // ---------- icons ----------
  const I = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    pulse: '<path d="M3 12h4l3 7 4-14 3 7h4"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M17 14.6c2.3.3 3.9 1.9 4.5 4.9"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    coin: '<circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.6 2.5 2 2.5.9 2.5 2-1.1 2-2.5 2c-1.1 0-2.1-.5-2.6-1.5M12 6.5v11"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    bank: '<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',
    bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    news: '<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>',
    flask: '<path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7 15h10"/>',
  };
  const svg = (k, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

  // ---------- pages ----------
  const PAGES = [["overview", "Overview", "home"], ["activity", "Activity", "pulse"], ["heroes", "Heroes", "users"],
                 ["guardians", "Guardians", "shield"], ["reports", "Reports", "chart"], ["calendar", "Calendar", "cal"]];
  $("tabList").innerHTML = PAGES.map(([k, t]) => `<button class="t" type="button" data-p="${k}">${t}</button>`).join("");
  $("rail").innerHTML = PAGES.map(([k, t, ic]) => `<button type="button" data-p="${k}" aria-label="${t}">${svg(ic)}<span>${t}</span></button>`).join("");
  let page = null;
  function go(p, push = true) {
    if (!PAGES.some(x => x[0] === p)) p = "overview";
    if (p === page) return;
    const old = page && $("p-" + page);
    page = p;
    document.querySelectorAll("[data-p]").forEach(b => b.classList.toggle("on", b.dataset.p === p));
    const tab = document.querySelector(`#tabList [data-p="${p}"]`); if (tab) tab.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    const show = () => { document.querySelectorAll(".page").forEach(s => s.classList.remove("on", "out")); $("p-" + p).classList.add("on"); $("scroll").scrollTop = 0; render(); };
    if (old) { old.classList.add("out"); setTimeout(show, 200); } else show();
    if (push) history.replaceState(null, "", "#" + p);
  }
  document.addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) go(b.dataset.p); });

  // ---------- data ----------
  let S = null, IDX = [], live = null, lastOk = 0;
  async function poll() {
    try {
      const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      S = await r.json(); lastOk = Date.now(); live = true;
    } catch (_) { live = false; }
    setLive(); render();
  }
  async function loadIndex() {
    try { const r = await fetch("reports/index.json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { IDX = await r.json(); render(); } } catch (_) {}
  }
  function setLive() {
    const el = $("live"), stale = S && S.updated && (Date.now() - new Date(S.updated).getTime() > 20 * 60 * 1000);
    el.className = "live " + (live && !stale ? "on" : live ? "" : "off");
    el.querySelector("span").textContent = !live ? "Offline" : stale ? "Paused" : S && S.market_open ? "Market open" : "Market closed";
  }

  const traders = () => (S?.bots || []).filter(b => !b.role && !b.retired);
  const guardians = () => (S?.bots || []).filter(b => b.role);
  const heroName = b => (b.hero && b.hero.hero) || b.name;
  const dayPL = () => S?.guardians?.risk?.day_pl;

  // ---------- small charts ----------
  function ring(frac, label, sub, size = 92) {
    const r = 38, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, n(frac)));
    return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 92 92"><circle class="trk" cx="46" cy="46" r="${r}"/>
      <circle class="val" cx="46" cy="46" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>
      <div class="in"><div>${label}<small>${sub || ""}</small></div></div></div>`;
  }
  function bars(rows) {   // rows: [{label, v, hi}]
    if (!rows.length) return `<div class="empty">The chart fills in after a few trading days.</div>`;
    const W = 560, H = 170, pad = 22, max = Math.max(1, ...rows.map(r => Math.abs(r.v)));
    const anyNeg = rows.some(r => r.v < 0), zero = anyNeg ? H * 0.62 : H - pad, room = anyNeg ? zero - 10 : zero - 10;
    const bw = Math.min(30, (W - 10) / rows.length * 0.56), step = (W - 10) / rows.length;
    let out = `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" preserveAspectRatio="none" role="img" aria-label="Daily results">`;
    out += `<line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="rgba(38,30,25,.18)" stroke-dasharray="3 4"/>`;
    rows.forEach((r, i) => {
      const h = Math.max(3, Math.abs(r.v) / max * (r.v >= 0 ? room : (H - pad - zero + 6))), x = 5 + i * step + (step - bw) / 2;
      const y = r.v >= 0 ? zero - h : zero, fill = r.hi ? "var(--coral)" : r.v >= 0 ? "rgba(255,255,255,.85)" : "rgba(70,52,42,.32)";
      out += `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(8, bw / 2)}" fill="${fill}"><title>${esc(r.label)}: ${usd(r.v)}</title></rect>`;
      out += `<text x="${x + bw / 2}" y="${H + 12}" text-anchor="middle">${esc(r.short || "")}</text>`;
    });
    return out + "</svg>";
  }
  function line(points) {   // points: [{label, v}], cumulative
    if (points.length < 2) return `<div class="empty">The line appears after two trading days.</div>`;
    const W = 560, H = 180, pad = 14, vs = points.map(p => p.v), lo = Math.min(0, ...vs), hi = Math.max(0, ...vs), span = (hi - lo) || 1;
    const X = i => pad + i * (W - 2 * pad) / (points.length - 1), Y = v => pad + (hi - v) / span * (H - 2 * pad);
    let d = `M${X(0)},${Y(vs[0])}`;
    for (let i = 1; i < vs.length; i++) { const x0 = X(i - 1), x1 = X(i), cx = (x0 + x1) / 2; d += ` C${cx},${Y(vs[i - 1])} ${cx},${Y(vs[i])} ${x1},${Y(vs[i])}`; }
    const area = d + ` L${X(vs.length - 1)},${Y(lo)} L${X(0)},${Y(lo)} Z`;
    const ticks = points.map((p, i) => (i % Math.ceil(points.length / 7) === 0 || i === points.length - 1) ? `<text x="${X(i)}" y="${H + 12}" text-anchor="middle">${esc(p.short)}</text>` : "").join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" preserveAspectRatio="none" role="img" aria-label="Running total">
      <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef6040" stop-opacity=".28"/><stop offset="1" stop-color="#ef6040" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(38,30,25,.25)" stroke-dasharray="3 4"/>
      <path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="#ef6040" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="${X(vs.length - 1)}" cy="${Y(vs[vs.length - 1])}" r="4.5" fill="#ef6040" stroke="#fff" stroke-width="2"/>${ticks}</svg>`;
  }
  const PALETTE = ["#ef6040", "#2b2420", "#e2a531", "#4f7fe0", "#3fae7a", "#a777e3"];
  function donut(items, center, sub) {
    const total = items.reduce((a, b) => a + n(b.v), 0) || 1, r = 52, c = 2 * Math.PI * r;
    let off = 0, segs = "";
    items.forEach((it, i) => { const f = n(it.v) / total, len = Math.max(0, f * c - 3);
      segs += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${PALETTE[i % PALETTE.length]}" stroke-width="16" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`; off += f * c; });
    return `<svg viewBox="0 0 140 140" style="width:100%;max-width:150px;transform:rotate(-90deg)">${segs}</svg>
      <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none"><div><div style="font-weight:700;font-size:15px">${center}</div><div style="font-size:10px;color:var(--ink-3)">${sub}</div></div></div>`;
  }

  // ---------- render ----------
  function render() {
    if (!page) return;
    greet(); ask();
    const fn = { overview, activity, heroes, guardians: guardiansPage, reports, calendar }[page];
    const el = $("p-" + page);
    if (!S) { el.innerHTML = `<div class="ph"><div><h1>${esc(PAGES.find(p => p[0] === page)[1])}</h1><p class="sub">${live === false ? "Can't reach Goldmire. Is the PC on and Goldmire running?" : "Loading…"}</p></div></div>`; return; }
    const keep = $("scroll").scrollTop;
    el.innerHTML = fn();
    $("scroll").scrollTop = keep;
    el.querySelectorAll(".card").forEach((c, i) => c.style.setProperty("--i", i));
    bindPage(el);
  }
  function greet() {
    const h = new Date().getHours();
    $("hello").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    $("helloSub").textContent = S ? `Goldmire · ${traders().length} trader${traders().length === 1 ? "" : "s"}, ${guardians().length} guardians` : "Goldmire · paper trading";
  }
  let askI = 0, askMsgs = [];
  function ask() {
    if (!S) return;
    const d = dayPL(), w = S.guardians?.weather; let cal = S.calendar?.earnings || [];
    askMsgs = [
      `Today ${usd(d)} · ${S.market_open ? "market open" : "market closed"}`,
      w ? `Market weather ${w.state}: S&P 500 ${w.trend_up ? "above" : "below"} its 200-day average` : null,
      (cal = cal.filter(e => e.date >= todayNY())).length ? `Next earnings: ${cal[0].symbol} (${firstName(cal[0].hero)}) ${dayShort(cal[0].date, true)}, ${cal[0].when}` : null,
      (S.alerts || []).filter(a => !a.resolved).length ? `⚠ ${S.alerts.filter(a => !a.resolved)[0].message}` : "No alerts. Everything's running smoothly",
      `All heroes since the start: ${usd(S.total_pl)}`,
    ].filter(Boolean);
    if ($("askText").textContent.startsWith("Reading")) $("askText").textContent = askMsgs[0];
  }
  setInterval(() => { if (!askMsgs.length) return; const t = $("askText"); t.classList.add("swap"); setTimeout(() => { askI = (askI + 1) % askMsgs.length; t.textContent = askMsgs[askI]; t.classList.remove("swap"); }, 350); }, 5000);

  function stat(i, icon, label, value, chip, extra = "") {
    return `<div class="card" style="--i:${i}"><div class="lbl"><span class="ic">${svg(icon)}</span>${label}</div><div class="big num">${value}</div><div>${chip}${extra}</div></div>`;
  }
  function alertsHtml() {
    return (S.alerts || []).map(a => `<div class="alert${a.resolved ? " done" : ""}">${svg("bell")}<div><b>${a.resolved ? "Resolved" : "Watchdog alert"}</b>${esc(a.message)}<div class="meta" style="margin:3px 0 0">${esc(a.count)}× · last ${timeOf(a.last)}</div></div></div>`).join("");
  }
  function dailyRows() {
    const today = S.today?.day, rows = [...IDX].filter(d => new Date(d.day + "T12:00:00").getDay() % 6 !== 0 || n(d.closed_pl) !== 0).slice(0, 14).reverse()
      .map(d => ({ label: dayShort(d.day), short: dayShort(d.day, true).split(" ")[1], v: n(d.closed_pl), hi: d.day === today }));
    if (today && S.today && !rows.some(r => r.hi)) rows.push({ label: "Today", short: "now", v: n(S.today.closed_pl), hi: true });
    return rows;
  }

  function overview() {
    const t = S.today || {}, acct = t.account || {}, d = dayPL(), held = (t.holding || []).length;
    const wins = (t.closed || []).filter(x => x.pl > 0).length, losses = (t.closed || []).length - wins;
    const cal = [...(S.calendar?.earnings || []).map(e => ({ date: e.date, title: `${e.symbol} earnings`, sub: `${firstName(e.hero)} · ${e.when}` })),
                 ...(S.calendar?.economy || []).map(e => ({ date: e.date, title: e.event, sub: `${e.time_et ? e.time_et + " ET" : ""}${e.consensus ? " · expected " + e.consensus : ""}` }))]
      .filter(c => c.date >= todayNY()).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
    const ts = traders();
    return `<div class="ph"><div><h1>${$("hello").textContent}</h1><p class="sub">${esc(t.headline || "Here's how your heroes are doing.")}</p></div></div>
      ${alertsHtml()}
      <div class="grid g4">
        ${stat(0, "trend", "Today", `<span class="${cls(d)}">${usd(d)}</span>`, `<span class="chip ${cls(d)}">${t.closed?.length || 0} sold · ${t.bought || 0} bought</span>`)}
        ${stat(1, "coin", "All heroes, all time", `<span class="${cls(S.total_pl)}">${usd(S.total_pl)}</span>`, `<span class="chip">${S.trades || 0} trades</span>`)}
        ${stat(2, "bank", "Paper account", acct.equity ? money(acct.equity) : "—", acct.change != null ? `<span class="chip ${cls(acct.change)}">${usd(acct.change)} today</span>` : "")}
        ${stat(3, "pulse", "Holdings", `${held}`, `<span class="chip ${cls(t.open_today)}">${usd(t.open_today)} today</span>`, `<span class="meta">${usd(t.open_pl)} so far</span>`)}
      </div>
      <div class="grid g-main" style="margin-top:14px">
        <div class="card"><h2>Daily results <small>closed trades, last ${Math.max(dailyRows().length, 1)} days · today in coral</small></h2>${bars(dailyRows())}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><span class="chip up">${wins} won today</span><span class="chip dn">${losses} lost today</span></div></div>
        <div class="card"><h2>Heroes <small>pot vs limit</small></h2>
          <div class="rows">${ts.map(b => `<div class="row" style="grid-template-columns:56px 1fr auto">${ring((b.bank?.pot || 0) / (b.bank?.limit || 1000), "", "", 52)}
            <div><div class="t"><b>${esc(heroName(b))}</b></div><div class="s">${esc(b.strategy_name)} · ${b.positions.length} held · Bram: ${esc(b.verdict || "—")}</div></div>
            <div class="v num">${money(b.bank?.pot)}<div class="s ${cls(b.pl)}">${usd(b.pl)} all time</div></div></div>`).join("") || `<div class="empty">No traders working.</div>`}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${guardians().map(g => `<span class="chip">${svg("shield", 2).replace("<svg", '<svg width="12" height="12"')} ${esc(firstName(heroName(g)))}</span>`).join("")}</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h2>Coming up <button class="btn ghost" data-p="calendar" type="button">Calendar</button></h2>${cal.map(c => `<div class="cal"><div class="d"><small>${new Date(c.date + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" })}</small>${new Date(c.date + "T12:00:00").getDate()}</div><div><div class="t"><b>${esc(c.title)}</b></div><div class="s" style="font-size:11.5px;color:var(--ink-3)">${esc(c.sub)}</div></div><span></span></div>`).join("") || `<div class="empty">Nothing big on the calendar.</div>`}</div>
        <div class="card"><h2>Town Crier <small>big headlines</small></h2><div class="rows">${(S.news?.crier || []).slice(0, 5).map(c => `<div class="row"><div class="av ${c.tone > 0 ? "up" : "dn"}">${esc((c.symbols || [])[0] || "")}</div><div><div class="t">${esc(c.headline)}</div><div class="s">${timeOf(c.time)}</div></div><span class="chip ${c.tone > 0 ? "up" : "dn"}">${c.tone > 0 ? "good" : "bad"}</span></div>`).join("") || `<div class="empty">Quiet so far.</div>`}</div></div>
      </div>`;
  }

  function activity() {
    const t = S.today || {};
    const sold = (t.closed || []).map(x => ({ t: x.time, html: `<div class="row"><div class="av ${cls(x.pl)}">${x.pl >= 0 ? "▲" : "▼"}</div>
      <div><div class="t"><b>Sold ${esc(x.symbol)}</b> · ${esc(firstName(x.hero))}</div><div class="s">${timeOf(x.time)} · paid $${n(+x.paid).toFixed(2)} → $${n(+x.sold).toFixed(2)} · ${esc(x.why)}${x.reason ? " " + esc(x.reason) : ""}</div></div><div class="v num ${cls(x.pl)}">${usd(x.pl)}</div></div>` }));
    const bought = (t.buys || []).map(x => ({ t: x.time, html: `<div class="row"><div class="av buy">+</div>
      <div><div class="t"><b>Bought ${esc(x.symbol)}</b> · ${esc(firstName(x.hero))}</div><div class="s">${timeOf(x.time)}${x.price ? ` · about $${n(x.price).toFixed(2)} a share` : ""}</div></div><div class="v num">${money(x.dollars)}</div></div>` }));
    const all = [...sold, ...bought].sort((a, b) => String(b.t).localeCompare(String(a.t))).map(x => x.html).join("");
    const past = IDX.slice(0, 12).map(d => `<div class="row"><div class="av ${cls(d.closed_pl)}">${new Date(d.day + "T12:00:00").getDate()}</div><div><div class="t"><b>${dayShort(d.day)}</b></div><div class="s">${esc(d.headline)}</div></div><div class="v num ${cls(d.closed_pl)}">${usd(d.closed_pl)}</div></div>`).join("");
    return `<div class="ph"><div><h1>Activity</h1><p class="sub">Every buy and sale today, the big headlines, and how each day went.</p></div></div>
      <div class="grid g-main">
        <div class="card"><h2>Today <small>${(t.closed || []).length} sold · ${(t.buys || []).length} bought</small></h2><div class="rows">${all || `<div class="empty">No trades yet today.</div>`}</div></div>
        <div class="card"><h2>Town Crier</h2><div class="rows">${(S.news?.crier || []).slice(0, 8).map(c => `<div class="row"><div class="av ${c.tone > 0 ? "up" : "dn"}">${esc((c.symbols || [])[0] || "")}</div><div><div class="t">${esc(c.headline)}</div><div class="s">${timeOf(c.time)} · ${esc((c.symbols || []).join(", "))}</div></div><span></span></div>`).join("") || `<div class="empty">Quiet so far.</div>`}</div></div>
      </div>
      <div class="card" style="margin-top:14px"><h2>Past days <a class="btn ghost" href="town.html" style="text-decoration:none">Full ledger &amp; exports</a></h2><div class="rows">${past || `<div class="empty">The first daily report is saved at 4:05 PM New York time.</div>`}</div></div>`;
  }

  function verdictChip(v) { return v ? `<span class="chip ${v === "PASS" ? "up" : v === "CONDITIONAL" ? "amber" : "dn"}">Bram: ${esc(v)}</span>` : ""; }
  function holdTiles(b) {
    return `<div class="tiles">${b.positions.map(p => `<div class="tile"><div class="sy">${esc(p.symbol)}${p.hold ? `<span class="chip coral">HOLD</span>` : p.earnings && p.earnings.date >= todayNY() ? `<span class="chip amber" title="Earnings ${esc(dayShort(p.earnings.date))} ${esc(p.earnings.when)}">E ${esc(dayShort(p.earnings.date, true))}</span>` : ""}</div>
      <div class="pl num ${cls(p.pl)}">${p.pending ? "filling…" : usd(p.pl)}</div><div class="c">${money(p.cost)} in</div></div>`).join("")}</div>`;
  }
  function heroes() {
    const ts = traders(), retired = (S.bots || []).filter(b => b.retired);
    return `<div class="ph"><div><h1>Heroes</h1><p class="sub">The traders, what they hold, and how close each pot is to its limit.</p></div><button class="btn" type="button" data-open="suggest">＋ Suggest a stock</button></div>
      ${ts.map((b, i) => { const h = b.hero || {}, k = b.bank || {};
        return `<div class="card" style="margin-bottom:14px"><div class="hero">${ring((k.pot || 0) / (k.limit || 1000), money(k.pot).replace(".00", ""), "of $" + n(k.limit).toLocaleString())}
          <div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="hname">${esc(heroName(b))}</span>${verdictChip(b.verdict)}${b.benched ? `<span class="chip">benched</span>` : ""}</div>
            <div class="hsub">${esc(h.cls || "")} · level ${n(h.level)} ${esc(h.title || "")} · ${esc(b.strategy_name)} · up to ${b.max_positions} at once</div>
            <div class="kv"><div>All time<b class="num ${cls(b.pl)}">${usd(b.pl)}</b></div><div>Sold so far<b class="num ${cls(b.realized_pl)}">${usd(b.realized_pl)}</b></div><div>Still held<b class="num ${cls(b.unrealized_pl)}">${usd(b.unrealized_pl)}</b></div>
              <div>Trades<b>${n(h.trades)} (${n(h.wins)} won)</b></div><div>Savings<b class="num">${money(k.savings)}</b></div><div>Best trade<b class="num up">${usd(h.best)}</b></div></div></div></div>
          <h2 style="margin-top:18px">Holding <small>${b.positions.length} of ${b.max_positions}${b.positions.length > b.max_positions ? " · no new buys until under the limit" : ""}</small></h2>${b.positions.length ? holdTiles(b) : `<div class="empty">Nothing held right now.</div>`}</div>`; }).join("") || `<div class="card"><div class="empty">No traders working.</div></div>`}
      ${guardians().some(g => g.positions.length) ? `<div class="card"><h2>Guardians' leftovers <small>bought before their new jobs; sold by their old rules, never added to</small></h2>${guardians().filter(g => g.positions.length).map(g => `<div style="margin:8px 0 4px;font-weight:600;font-size:12.5px">${esc(heroName(g))}</div>${holdTiles(g)}`).join("")}</div>` : ""}
      ${retired.length ? `<p class="sub" style="margin-top:14px">Retired: ${retired.map(b => esc(heroName(b))).join(", ")}.</p>` : ""}`;
  }

  function guardiansPage() {
    const G = S.guardians || {}, R = G.risk || {}, W = G.weather || {}, X = G.execution || {}, V = G.validator || [];
    const stop = n(R.daily_stop) || 500, d = n(R.day_pl), f = Math.max(-1, Math.min(1, d / stop));
    const inds = (R.industries || []).slice(0, 5), lim = n(R.industry_limit) || 1;
    const named = nm => { const g = guardians().find(b => b.role === nm); return g ? heroName(g) : nm; };
    return `<div class="ph"><div><h1>Guardians</h1><p class="sub">They never open trades. Pip watches risk, Bram checks the tests, Ysolde checks every dollar against Alpaca.</p></div></div>
      <div class="grid g3">
        <div class="card"><div class="lbl"><span class="ic">${svg("shield")}</span>${esc(named("risk"))} · risk</div>
          <div class="big num ${cls(d)}">${usd(d)}</div><div class="scale"><span>−$${stop}</span><span>today</span><span>+$${stop}</span></div>
          <div class="gauge"><div class="mid"></div><span style="left:${f < 0 ? 50 + f * 50 : 50}%;width:${Math.abs(f) * 50}%;background:${d < 0 ? "var(--dn)" : "var(--up)"}"></span></div>
          <span class="chip ${R.stopped ? "dn" : "up"}">${R.stopped ? "Daily stop ON: no buys today" : `Daily stop at −$${stop}: not close`}</span></div>
        <div class="card"><div class="lbl"><span class="ic">${svg("trend")}</span>Market weather</div>
          <div class="big">${esc(W.state || "—")}</div>
          <div class="sub" style="margin-top:0">S&amp;P 500 ${W.spy ? `at $${n(W.spy).toFixed(2)}, ` : ""}${W.trend_up ? "above" : "below"} its 200-day average${W.spy_200 ? ` ($${n(W.spy_200).toFixed(2)})` : ""}. Jumpier than ${Math.round(n(W.vol_rank) * 100)}% of the last year.</div></div>
        <div class="card"><div class="lbl"><span class="ic">${svg("bank")}</span>${esc(named("execution"))} · the books</div>
          <div class="big num ${Math.abs(n(X.unexplained)) > 25 ? "dn" : ""}">${usd(X.unexplained)}</div>
          <div class="sub" style="margin-top:0">unexplained on ${esc(dayShort(X.day))}: account ${usd(X.account_change)}, heroes ${usd(X.heroes)}${(X.orphans || []).length ? `, ${X.orphans.length} position(s) no hero owns` : ""}. Checked ${timeOf(X.checked)}.</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h2>Money by industry <small>limit $${Math.round(lim)} each (50% of the working pots)</small></h2>
          <div class="donut"><div style="position:relative">${donut(inds.map(x => ({ v: x.value })), "$" + Math.round(inds.reduce((a, b) => a + n(b.value), 0)), "top industries")}</div>
          <div class="legend">${inds.map((x, i) => `<div class="li"><i style="background:${PALETTE[i]}"></i><span>${esc(x.name)}</span><b class="num">$${Math.round(x.value)}</b><div class="track"><span style="width:${Math.min(100, x.value / lim * 100)}%;background:${PALETTE[i]}"></span></div></div>`).join("") || `<div class="empty">Nothing held.</div>`}</div></div></div>
        <div class="card"><h2>${esc(named("validator"))}'s verdicts <small>new buys need a test that holds up</small></h2><div class="rows">
          ${V.map(v => `<div class="row"><div class="av ${v.verdict === "PASS" ? "up" : v.verdict === "CONDITIONAL" ? "" : "dn"}">${esc(firstName(v.hero)).slice(0, 2)}</div><div><div class="t"><b>${esc(v.hero)}</b></div><div class="s">${v.verdict === "FAIL" || v.verdict === "INSUFFICIENT EVIDENCE" ? (v.approved ? "you approved this hero anyway" : "no new buys until a test passes") : "allowed to buy (paper trading)"}</div></div>${verdictChip(v.verdict).replace("Bram: ", "")}</div>`).join("") || `<div class="empty">No traders to judge.</div>`}</div></div>
      </div>`;
  }

  function reports() {
    const sc = S.scorecard || [], T = S.tests || {};
    const cum = []; let run = 0; [...IDX].reverse().forEach(d => { run += n(d.closed_pl); cum.push({ short: dayShort(d.day, true), v: run }); });
    const vchip = v => `<span class="chip ${v === "PASSES" || v === "KEEP" ? "up" : v === "PROMISING" ? "amber" : v === "STOP" ? "coral" : "dn"}">${esc(v || "—")}</span>`;
    const big = T.big ? `<div class="tw"><table><thead><tr><th>Strategy</th><th>Verdict</th><th class="n">Trades</th><th class="n">Result</th><th class="n">Beat random</th></tr></thead><tbody>
      ${T.big.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${vchip(r.verdict)}</td><td class="n">${n(r.trades).toLocaleString()}</td><td class="n ${cls(r.pl)}">${usd(r.pl)}</td><td class="n">${Math.round(n(r.beats_random) * 100)}%</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">Running in the background…</div>`;
    const ht = (h, label) => h ? `<div class="row"><div class="av ${h.verdict && h.verdict.startsWith("STOP") ? "dn" : "up"}">${svg("news", 2).replace("<svg", '<svg width="15" height="15"')}</div><div><div class="t"><b>${label}</b></div><div class="s">${esc(h.why || "")}</div></div>${vchip(h.verdict && h.verdict.startsWith("STOP") ? "STOP" : "KEEP")}</div>` : "";
    const vol = T.volume ? `<div class="tw"><table><thead><tr><th>Strategy</th><th>Time candles</th><th>Volume candles</th></tr></thead><tbody>${T.volume.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${vchip(r.time.verdict)} <span class="meta num">${usd(r.time.pl)}</span></td><td>${vchip(r.volume.verdict)} <span class="meta num">${usd(r.volume.pl)}</span></td></tr>`).join("")}</tbody></table></div><p class="sub">${esc(T.volume.verdict)}</p>` : `<div class="empty">Running in the background…</div>`;
    return `<div class="ph"><div><h1>Reports</h1><p class="sub">Is each trader living up to its tests, and what the latest experiments found.</p></div></div>
      <div class="goals">${sc.map(c => `<div class="card goal">${ring(n(c.trades) / n(c.min_trades || 20), `${c.trades}`, `of ${c.min_trades || 20} trades`)}<div class="gt">${esc(c.hero)}</div>
        <div class="gs"><span class="${cls(c.result)}">${usd(c.result)}</span> vs S&amp;P ${c.spy_result != null ? `<span class="${cls(c.spy_result)}">${usd(c.spy_result)}</span>` : "—"} since ${esc(dayShort(c.since, true))}</div>
        <div class="gs">wins ${c.live_win != null ? Math.round(c.live_win * 100) + "%" : "—"} live · ${c.test_win != null ? Math.round(c.test_win * 100) + "%" : "—"} in tests</div>
        <div style="margin-top:8px">${`<span class="chip ${c.verdict === "ON TRACK" ? "up" : c.verdict === "BEHIND" ? "dn" : ""}">${esc(c.verdict)}</span>`}</div></div>`).join("")}</div>
      <div class="grid g-main" style="margin-top:14px">
        <div class="card"><h2>Running total <small>closed trades, all heroes</small></h2>${line(cum)}</div>
        <div class="card"><h2>News tests</h2><div class="rows">${ht(T.headlines, "Headline selling (Wren, last year)") + ht(T.headlines_300, "Headline selling (300 stocks, 5 years)") || ""}
          ${T.news ? `<div class="row"><div class="av">${svg("flask", 2).replace("<svg", '<svg width="15" height="15"')}</div><div><div class="t"><b>FinBERT vs word list</b></div><div class="s">${esc(T.news.why)}</div></div>${vchip(T.news.verdict === "KEEP WORD LIST" || T.news.verdict === "TOO CLOSE" ? "KEEP" : T.news.verdict)}</div>` : ""}
          ${!T.headlines && !T.news ? `<div class="empty">No results yet.</div>` : ""}</div></div>
      </div>
      <div class="card" style="margin-top:14px"><h2>The big test <small>${T.big ? `${T.big.stocks} largest US companies, ${T.big.years} years · a pass needs to beat 95% of random traders` : ""}</small></h2>${big}</div>
      <div class="card" style="margin-top:14px"><h2>Volume candles vs time candles <small>${T.volume ? `${T.volume.stocks} stocks, ${T.volume.years} years of minute prices` : ""}</small></h2>${vol}</div>`;
  }

  function calendar() {
    const E = S.calendar?.earnings || [], X = S.calendar?.economy || [];
    const by = {}; [...E.map(e => ({ ...e, kind: "e" })), ...X.map(e => ({ ...e, kind: "x" }))].forEach(e => (by[e.date] = by[e.date] || []).push(e));
    const days = Object.keys(by).filter(d => d >= todayNY()).sort();
    return `<div class="ph"><div><h1>Calendar</h1><p class="sub">Earnings for stocks the heroes hold, and the big US economic releases. The heroes hold through earnings.</p></div></div>
      <div class="grid g2">${days.map((d, i) => `<div class="card" style="--i:${i}"><h2>${esc(dayShort(d))}<small>${by[d].length} event${by[d].length === 1 ? "" : "s"}</small></h2><div class="rows">
        ${by[d].map(e => e.kind === "e" ? `<div class="row"><div class="av" style="background:var(--coral-soft);color:var(--coral)">${esc(e.symbol).slice(0, 4)}</div><div><div class="t"><b>${esc(e.name || e.symbol)}</b></div><div class="s">${esc(firstName(e.hero))} holds it · ${esc(e.when || "time not set")}${e.eps_forecast ? " · expects " + esc(e.eps_forecast) + " a share" : ""}</div></div><span class="chip coral">earnings</span></div>`
          : `<div class="row"><div class="av">${svg("bank", 2).replace("<svg", '<svg width="15" height="15"')}</div><div><div class="t"><b>${esc(e.event)}</b></div><div class="s">${e.time_et ? esc(e.time_et) + " ET" : ""}${e.consensus ? " · expected " + esc(e.consensus) : ""}${e.previous ? " · last " + esc(e.previous) : ""}${e.actual ? " · actual " + esc(e.actual) : ""}</div></div><span class="chip">economy</span></div>`).join("")}</div></div>`).join("") || `<div class="card"><div class="empty">Nothing on the calendar yet.</div></div>`}</div>`;
  }

  function bindPage(el) { el.querySelectorAll("[data-open=suggest]").forEach(b => b.addEventListener("click", openSuggest)); }

  // ---------- suggest sheet ----------
  function sheet(id, on) { $(id).classList.toggle("on", on); $("veil").classList.toggle("on", on || document.querySelector(".sheet.on") != null); }
  function closeSheets() { document.querySelectorAll(".sheet").forEach(s => s.classList.remove("on")); $("veil").classList.remove("on"); }
  $("veil").addEventListener("click", closeSheets);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });
  function openSuggest() {
    const ts = traders().filter(b => !b.benched);
    $("sgWho").innerHTML = `<option value="any">Any hero</option>` + ts.map(b => `<option value="${esc(b.name)}">${esc(heroName(b))}</option>`).join("");
    const pins = ts.flatMap(b => (b.pinned || []).map(s => ({ s, b })));
    $("sgPins").innerHTML = pins.map(({ s, b }) => `<span><b>${esc(s)}</b> ${esc(firstName(heroName(b)))}<button type="button" data-unpin="${esc(s)}" data-bot="${esc(b.name)}" aria-label="Remove">✕</button></span>`).join("");
    $("sgMsg").textContent = live ? "" : "Works when Goldmire is running on your PC.";
    sheet("sgSheet", true); setTimeout(() => $("sgSym").focus(), 250);
  }
  $("plusBtn").addEventListener("click", openSuggest);
  async function sendSuggest(body) {
    try {
      const r = await fetch("/api/suggest", { method: "POST", headers: { "Content-Type": "application/json", "X-Goldmire": "suggest" }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      $("sgMsg").textContent = j.message || (r.ok ? "Done." : "Couldn't do that.");
      if (r.ok && j.ok) poll();
      return r.ok && j.ok;
    } catch (_) { $("sgMsg").textContent = "Couldn't reach Goldmire. Is the PC on and Goldmire running?"; return false; }
  }
  $("sgGo").addEventListener("click", async () => { const sym = $("sgSym").value.trim().toUpperCase(); if (!sym) { $("sgMsg").textContent = "Type a symbol first."; return; } if (await sendSuggest({ bot: $("sgWho").value, symbol: sym })) $("sgSym").value = ""; });
  $("sgSym").addEventListener("keydown", e => { if (e.key === "Enter") $("sgGo").click(); });
  $("sgPins").addEventListener("click", async e => { const b = e.target.closest("[data-unpin]"); if (b && await sendSuggest({ bot: b.dataset.bot, symbol: b.dataset.unpin, remove: true })) b.parentElement.remove(); });

  // ---------- updates ----------
  const upd = { u: null, target: null, timer: null };
  const vge = (a, b) => { const p = s => String(s).split(".").map(Number); const x = p(a), y = p(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return true; };
  async function updCheck(force) {
    if (location.protocol === "file:") return;
    try {
      const r = await fetch("/api/update" + (force ? "?check=1" : ""), { cache: "no-store" });
      const u = await r.json(); if (!u || !u.version) throw 0; upd.u = u;
      if (upd.target && vge(u.version, upd.target)) { location.reload(); return; }
      if (upd.target && u.state === "failed") upd.target = null;
    } catch (_) {}
    updRender();
  }
  function updRender() {
    const u = upd.u, av = u && u.available;
    $("updBtn").classList.toggle("has", !!av);
    $("upTitle").textContent = upd.target ? `Installing ${upd.target}…` : av ? `Goldmire ${av.version} is ready` : "You're up to date";
    $("upText").innerHTML = upd.target ? "Goldmire restarts by itself in about a minute. This page reloads when it's back."
      : u && u.state === "failed" ? `The last update didn't install: ${esc(u.error || "")}`
      : av ? (av.notes || []).map(x => "• " + esc(x)).join("<br>") + "<br><br>Your heroes, keys, gold and savings stay exactly as they are."
      : u ? `Version ${esc(u.version)}.` : "Can't check right now.";
    $("upBtns").innerHTML = av && !upd.target ? `<button class="btn" id="upGo" type="button">Update now</button> <button class="btn ghost" id="upLater" type="button">Later</button>` : `<button class="btn ghost" id="upLater" type="button">Close</button>`;
    const go = $("upGo"); if (go) go.onclick = updStart; $("upLater").onclick = closeSheets;
  }
  async function updStart() {
    const want = upd.u?.available?.version; if (!want) return;
    upd.target = want; updRender(); clearInterval(upd.timer); upd.timer = setInterval(() => updCheck(false), 2500);
    try { await fetch("/api/update", { method: "POST", headers: { "X-Goldmire": "update" }, cache: "no-store" }); } catch (_) {}
  }
  $("updBtn").addEventListener("click", () => { updRender(); sheet("upSheet", true); updCheck(true); });

  // ---------- start ----------
  go((location.hash || "#overview").slice(1), false);
  window.addEventListener("hashchange", () => go((location.hash || "#overview").slice(1), false));
  poll(); loadIndex();
  setInterval(poll, 15000); setInterval(loadIndex, 120000); setInterval(setLive, 30000);
  setTimeout(() => updCheck(true), 1500); upd.timer = setInterval(() => updCheck(false), 300000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); updCheck(false); } });
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
